name: Build VMHide 1.1.2 (edb3de9 x86_64)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout upstream VMHide edb3de9
        uses: actions/checkout@v4
        with:
          repository: Carnations-Botanica/VMHide
          ref: edb3de9
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Xcode build Release x86_64
        run: |
          xcodebuild -scheme VMHide \
                     -configuration Release \
                     -arch x86_64 \
                     ONLY_ACTIVE_ARCH=NO \
                     build

      - name: Upload VMHide.kext
        uses: actions/upload-artifact@v4
        with:
          name: VMHide-1.1.2-x86_64
          path: build/Release/VMHide.kext
