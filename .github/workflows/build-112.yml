name: Build VMHide 1.1.2 (edb3de9 x86_64)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Git clone upstream repo
        run: |
          git clone https://github.com/Carnations-Botanica/VMHide.git src
          cd src
          git checkout edb3de9
          git submodule update --init --recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Xcode build Release x86_64 (no codesign)
        run: |
          cd src
          xcodebuild -scheme VMHide \
                     -configuration Release \
                     -arch x86_64 \
                     ONLY_ACTIVE_ARCH=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

      - name: Upload VMHide.kext
        uses: actions/upload-artifact@v4
        with:
          name: VMHide-1.1.2-x86_64
          path: src/build/Release/VMHide.kext
